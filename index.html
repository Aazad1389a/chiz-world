<!DOCTYPE html>
<html lang="en">

<link rel="icon" href="data:,">

    <!-- =========================================
         AZAD WORLD
         Main HTML Entry
         Version 1.0
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="description"
        content="AZAD WORLD - High Quality 3D Web Game"
    >

    <meta
        name="theme-color"
        content="#05070a"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>AZAD WORLD</title>


    <!-- =========================================
         Main Stylesheet
    ========================================== -->

    <link
        rel="stylesheet"
        href="./style.css"
    >


    <!-- =========================================
         Preconnect
         Improves loading of external resources
    ========================================== -->

    <link
        rel="preconnect"
        href="https://cdn.jsdelivr.net"
        crossorigin
    >


    <!-- =========================================
         Import Map
         Three.js
    ========================================== -->

    <script type="importmap">

    {
        "imports": {

            "three":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

        }
    }

    </script>

</head>


<body>

    <!-- =========================================
         GAME APPLICATION
    ========================================== -->

    <main id="game">

        <!-- =====================================
             3D CANVAS CONTAINER
        ====================================== -->

        <div
            id="game-canvas"
            aria-label="3D Game"
        ></div>


        <!-- =====================================
             LOADING SCREEN
        ====================================== -->

        <section
            id="loading-screen"
            class="screen active"
            aria-label="Loading game"
        >

            <div class="loading-content">

                <div class="game-logo">
                    AZAD WORLD
                </div>

                <div class="game-version">
                    VERSION 1.0
                </div>

                <div class="loading-bar">

                    <div
                        id="loading-progress"
                        class="loading-progress"
                    ></div>

                </div>

                <div
                    id="loading-text"
                    class="loading-text"
                >
                    Initializing graphics...
                </div>

            </div>

        </section>


        <!-- =====================================
             MAIN MENU
        ====================================== -->

        <section
            id="main-menu"
            class="screen hidden"
            aria-label="Main menu"
        >

            <div class="menu-background"></div>

            <div class="menu-content">

                <div class="menu-logo">
                    AZAD WORLD
                </div>

                <div class="menu-subtitle">
                    OPEN WORLD EXPERIENCE
                </div>


                <div class="menu-buttons">

                    <button
                        id="play-button"
                        class="menu-button primary"
                        type="button"
                    >
                        PLAY
                    </button>

                    <button
                        id="settings-button"
                        class="menu-button"
                        type="button"
                    >
                        SETTINGS
                    </button>

                    <button
                        id="credits-button"
                        class="menu-button"
                        type="button"
                    >
                        CREDITS
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================
             HUD
        ====================================== -->

        <section
            id="hud"
            class="hud hidden"
            aria-label="Game interface"
        >

            <!-- Top Left -->

            <div class="hud-top-left">

                <div
                    id="player-name"
                    class="player-name"
                >
                    PLAYER
                </div>

                <div
                    id="player-level"
                    class="player-level"
                >
                    LEVEL 1
                </div>

            </div>


            <!-- Crosshair -->

            <div
                id="crosshair"
                class="crosshair"
                aria-hidden="true"
            >

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <!-- Bottom Left -->

            <div class="hud-bottom-left">

                <div class="status-row">

                    <span>HEALTH</span>

                    <div class="status-bar">

                        <div
                            id="health-bar"
                            class="status-fill health"
                        ></div>

                    </div>

                </div>


                <div class="status-row">

                    <span>STAMINA</span>

                    <div class="status-bar">

                        <div
                            id="stamina-bar"
                            class="status-fill stamina"
                        ></div>

                    </div>

                </div>

            </div>


            <!-- Bottom Right -->

            <div class="hud-bottom-right">

                <div
                    id="fps-counter"
                    class="fps-counter"
                >
                    FPS: --
                </div>

                <div
                    id="ping-counter"
                    class="ping-counter"
                >
                    PING: --
                </div>

            </div>

        </section>


        <!-- =====================================
             PAUSE MENU
        ====================================== -->

        <section
            id="pause-menu"
            class="screen hidden"
            aria-label="Pause menu"
        >

            <div class="pause-panel">

                <h2>PAUSED</h2>

                <button
                    id="resume-button"
                    class="menu-button primary"
                    type="button"
                >
                    RESUME
                </button>

                <button
                    id="pause-settings-button"
                    class="menu-button"
                    type="button"
                >
                    SETTINGS
                </button>

                <button
                    id="quit-button"
                    class="menu-button"
                    type="button"
                >
                    MAIN MENU
                </button>

            </div>

        </section>


        <!-- =====================================
             SETTINGS PANEL
        ====================================== -->

        <section
            id="settings-panel"
            class="screen hidden"
            aria-label="Graphics settings"
        >

            <div class="settings-panel">

                <h2>SETTINGS</h2>


                <div class="settings-section">

                    <h3>GRAPHICS</h3>


                    <label
                        class="setting-row"
                        for="graphics-quality"
                    >

                        <span>
                            GRAPHICS QUALITY
                        </span>

                        <select
                            id="graphics-quality"
                        >

                            <option value="low">
                                LOW
                            </option>

                            <option value="medium">
                                MEDIUM
                            </option>

                            <option
                                value="high"
                                selected
                            >
                                HIGH
                            </option>

                            <option value="ultra">
                                ULTRA
                            </option>

                        </select>

                    </label>


                    <label
                        class="setting-row"
                        for="shadow-quality"
                    >

                        <span>
                            SHADOW QUALITY
                        </span>

                        <select
                            id="shadow-quality"
                        >

                            <option value="low">
                                LOW
                            </option>

                            <option value="medium">
                                MEDIUM
                            </option>

                            <option
                                value="high"
                                selected
                            >
                                HIGH
                            </option>

                            <option value="ultra">
                                ULTRA
                            </option>

                        </select>

                    </label>


                    <label
                        class="setting-row"
                        for="render-scale"
                    >

                        <span>
                            RENDER SCALE
                        </span>

                        <select
                            id="render-scale"
                        >

                            <option value="0.75">
                                75%
                            </option>

                            <option
                                value="1"
                                selected
                            >
                                100%
                            </option>

                            <option value="1.25">
                                125%
                            </option>

                            <option value="1.5">
                                150%
                            </option>

                        </select>

                    </label>

                </div>


                <div class="settings-section">

                    <h3>DISPLAY</h3>


                    <label
                        class="setting-row"
                        for="fullscreen"
                    >

                        <span>
                            FULLSCREEN
                        </span>

                        <input
                            id="fullscreen"
                            type="checkbox"
                        >

                    </label>


                    <label
                        class="setting-row"
                        for="show-fps"
                    >

                        <span>
                            SHOW FPS
                        </span>

                        <input
                            id="show-fps"
                            type="checkbox"
                            checked
                        >

                    </label>

                </div>


                <button
                    id="close-settings-button"
                    class="menu-button primary"
                    type="button"
                >
                    BACK
                </button>

            </div>

        </section>


        <!-- =====================================
             MOBILE CONTROLS
        ====================================== -->

        <section
            id="mobile-controls"
            class="mobile-controls hidden"
            aria-label="Mobile controls"
        >

            <div
                id="joystick"
                class="joystick"
            >

                <div
                    id="joystick-knob"
                    class="joystick-knob"
                ></div>

            </div>


            <button
                id="mobile-jump"
                class="mobile-button"
                type="button"
            >
                JUMP
            </button>


            <button
                id="mobile-action"
                class="mobile-button action"
                type="button"
            >
                ACTION
            </button>

        </section>


        <!-- =====================================
             ERROR MESSAGE
        ====================================== -->

        <section
            id="error-screen"
            class="screen hidden"
            aria-label="Game error"
        >

            <div class="error-panel">

                <h2>
                    GAME ERROR
                </h2>

                <p
                    id="error-message"
                >
                    An unexpected error occurred.
                </p>

                <button
                    id="reload-button"
                    class="menu-button primary"
                    type="button"
                >
                    RELOAD
                </button>

            </div>

        </section>

    </main>


    <!-- =========================================
         APPLICATION SCRIPT
    ========================================== -->

    <script
        type="module"
        src="./src/main.js"
    ></script>


    <!-- =========================================
         Prevent accidental context menu
         inside game
    ========================================== -->

    <script>

        document
            .getElementById("game")
            .addEventListener(
                "contextmenu",
                function(event) {

                    event.preventDefault();

                }
            );

    </script>

</body>

</html>
